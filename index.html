<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Fácil - Generador de CV</title>
</head>

<body>

    <h1>CV Fácil</h1>

    <p>Crea tu CV profesional en pocos minutos.</p>

    <h2>Tus datos</h2>

    <label>Nombre completo</label>
    <br>
    <input type="text" id="nombre" placeholder="Ej: Juan García">

    <br><br>

    <label>Profesión</label>
    <br>
    <input type="text" id="profesion" placeholder="Ej: Diseñador gráfico">

    <br><br>

    <label>Email</label>
    <br>
    <input type="email" id="email" placeholder="ejemplo@email.com">

    <br><br>

    <button>Crear mi CV</button>

</body>
</html>
